<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de iconos</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 15px;
      font-family: Arial, sans-serif;
      background: #F7F8FA;
      color: #202B3C;
    }

    .contenedor {
      max-width: 650px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.07);
    }

    h1 {
      margin-top: 0;
      color: #172B4D;
    }

    label {
      display: block;
      margin-top: 20px;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #D5DCE5;
      border-radius: 7px;
    }

    button {
      margin-top: 15px;
      padding: 12px 18px;
      border: none;
      border-radius: 7px;
      background: #172B4D;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .vista {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 25px;
      flex-wrap: wrap;
      margin-top: 30px;
    }

    .icono {
      text-align: center;
    }

    canvas {
      width: 160px;
      height: 160px;
      border: 1px solid #E2E7EE;
      border-radius: 10px;
      background: white;
    }

    .mensaje {
      margin-top: 20px;
      font-size: 14px;
      color: #687386;
    }

    .descargas {
      margin-top: 25px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
  </style>
</head>

<body>

  <main class="contenedor">

    <h1>Generador de iconos</h1>

    <p>
      Prepara los iconos de instalación del catálogo
      utilizando el logotipo del negocio.
    </p>

    <label for="archivoLogo">
      Seleccionar logotipo desde la computadora
    </label>

    <input
      type="file"
      id="archivoLogo"
      accept="image/png,image/jpeg,image/webp"
    >

    <label for="urlLogo">
      O utilizar la URL del logotipo
    </label>

    <input
      type="url"
      id="urlLogo"
      placeholder="https://ejemplo.com/logo.png"
    >

    <button type="button" id="cargarLogo">
      Cargar logotipo
    </button>

    <div class="vista">

      <div class="icono">
        <canvas id="canvas192" width="192" height="192"></canvas>
        <p>Icono 192 × 192</p>
      </div>

      <div class="icono">
        <canvas id="canvas512" width="512" height="512"></canvas>
        <p>Icono 512 × 512</p>
      </div>

    </div>

    <div class="descargas">
      <button id="descargar192" disabled>
        Descargar icon-192.png
      </button>

      <button id="descargar512" disabled>
        Descargar icon-512.png
      </button>
    </div>

    <p class="mensaje" id="mensaje">
      Selecciona un logotipo para comenzar.
    </p>

  </main>

  <script src="config.js"></script>

  <script>
    const archivoLogo = document.getElementById("archivoLogo");
    const urlLogo = document.getElementById("urlLogo");
    const cargarLogo = document.getElementById("cargarLogo");
    const mensaje = document.getElementById("mensaje");

    const canvas192 = document.getElementById("canvas192");
    const canvas512 = document.getElementById("canvas512");

    const ctx192 = canvas192.getContext("2d");
    const ctx512 = canvas512.getContext("2d");

    let logoCargado = false;

    // CARGAR URL CONFIGURADA EN CONFIG.JS

    if (typeof CONFIG !== "undefined" && CONFIG.negocio.logo) {
      urlLogo.value = CONFIG.negocio.logo;
    }

    // DIBUJAR LOGOTIPO CONSERVANDO SUS PROPORCIONES

    function dibujarIcono(canvas, contexto, imagen) {

      const tamaño = canvas.width;
      const margen = tamaño * 0.15;
      const espacio = tamaño - margen * 2;

      const proporcion = Math.min(
        espacio / imagen.width,
        espacio / imagen.height
      );

      const ancho = imagen.width * proporcion;
      const alto = imagen.height * proporcion;

      const x = (tamaño - ancho) / 2;
      const y = (tamaño - alto) / 2;

      contexto.fillStyle = "#FFFFFF";
      contexto.fillRect(0, 0, tamaño, tamaño);

      contexto.drawImage(
        imagen,
        x,
        y,
        ancho,
        alto
      );
    }

    // PROCESAR IMAGEN

    function procesarImagen(imagen) {

      dibujarIcono(canvas192, ctx192, imagen);
      dibujarIcono(canvas512, ctx512, imagen);

      logoCargado = true;

      document.getElementById("descargar192").disabled = false;
      document.getElementById("descargar512").disabled = false;

      mensaje.textContent =
        "Iconos generados correctamente. Ya puedes descargarlos.";
    }

    // CARGAR LOGOTIPO

    cargarLogo.addEventListener("click", () => {

      const archivo = archivoLogo.files[0];
      const direccion = urlLogo.value.trim();

      const imagen = new Image();

      if (archivo) {

        imagen.onload = () => procesarImagen(imagen);
        imagen.onerror = () => {
          mensaje.textContent = "No se pudo abrir el archivo seleccionado.";
        };

        imagen.src = URL.createObjectURL(archivo);

      } else if (direccion) {

        imagen.crossOrigin = "anonymous";

        imagen.onload = () => procesarImagen(imagen);

        imagen.onerror = () => {
          mensaje.textContent =
            "No se pudo cargar la URL. El servidor de imágenes debe permitir acceso CORS. Puedes descargar el logo y seleccionarlo desde tu computadora.";
        };

        imagen.src = direccion;

      } else {

        mensaje.textContent =
          "Selecciona un archivo o introduce una URL.";

      }

    });

    // DESCARGAR PNG

    function descargarIcono(canvas, nombre) {

      if (!logoCargado) return;

      const enlace = document.createElement("a");

      enlace.download = nombre;
      enlace.href = canvas.toDataURL("image/png");

      enlace.click();
    }

    document.getElementById("descargar192")
      .addEventListener("click", () => {
        descargarIcono(canvas192, "icon-192.png");
      });

    document.getElementById("descargar512")
      .addEventListener("click", () => {
        descargarIcono(canvas512, "icon-512.png");
      });

  </script>

</body>
</html>
