<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Catálogo de prueba</title>

  <meta name="description" content="Catálogo digital de productos">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="encabezado">
    <div class="contenedor encabezado-interior">

      <a href="#" class="marca">
        <img id="logoNegocio" class="logo" alt="Logo del negocio">
        <span id="nombreNegocio">Catálogo de prueba</span>
      </a>

      <div class="estado-conexion" id="estadoConexion">
        Cargando catálogo...
      </div>

    </div>
  </header>

  <main class="contenedor">

    <section class="presentacion">
      <p class="etiqueta">CATÁLOGO DIGITAL</p>
      <h1 id="tituloCatalogo">Nuestros productos</h1>
      <p id="descripcionNegocio">
        Descubre nuestros productos.
      </p>
    </section>

    <section class="herramientas">

      <div class="buscador">
        <span>⌕</span>
        <input
          type="search"
          id="buscarProducto"
          placeholder="Buscar productos..."
          autocomplete="off"
        >
      </div>

      <div class="categorias" id="listaCategorias">
        <button class="categoria activa" data-categoria="TODAS">
          Todas
        </button>
      </div>

    </section>

    <section class="seccion-productos">

      <div class="titulo-seccion">
        <div>
          <h2>Productos</h2>
          <p id="cantidadProductos">Consultando productos...</p>
        </div>
      </div>

      <div id="mensajeEstado" class="mensaje-estado">
        Estamos cargando el catálogo...
      </div>

      <div id="contenedorProductos" class="productos-grid"></div>

    </section>
        <!-- CARRITO DE COMPRAS -->

    <section class="seccion-carrito" id="seccionCarrito">

      <div class="titulo-seccion">
        <div>
          <h2>Mi carrito</h2>
          <p id="cantidadCarrito">0 productos seleccionados</p>
        </div>
      </div>

      <div class="carrito-contenido">

        <div id="listaCarrito" class="lista-carrito">
          <p class="carrito-vacio">
            Todavía no has agregado productos.
          </p>
        </div>

        <div class="carrito-resumen">

          <div class="carrito-total">
            <span>Total</span>
            <strong id="totalCarrito">C$ 0.00</strong>
          </div>

          <button
            type="button"
            id="vaciarCarrito"
            class="boton-vaciar"
            disabled
          >
            Vaciar carrito
          </button>

        </div>

      </div>

    </section>
  </main>

  <footer class="pie">
    <p id="pieNegocio">Catálogo digital</p>
  </footer>

  <script src="config.js"></script>
  <script src="app.js"></script>

</body>
</html>
